name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: large_file_editor-linux-x86_64
            asset_extension: .tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: large_file_editor-macos-x86_64
            asset_extension: .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: large_file_editor-macos-aarch64
            asset_extension: .tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: large_file_editor-windows-x86_64
            asset_extension: .zip

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libclang-dev libgtk-3-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-release-

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/large_file_editor.exe -DestinationPath ${{ matrix.artifact_name }}${{ matrix.asset_extension }}

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x target/${{ matrix.target }}/release/large_file_editor
          tar -czf ${{ matrix.artifact_name }}${{ matrix.asset_extension }} -C target/${{ matrix.target }}/release large_file_editor

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}${{ matrix.asset_extension }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
